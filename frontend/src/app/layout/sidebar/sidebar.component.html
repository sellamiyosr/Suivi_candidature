<aside class="sidebar" [class.collapsed]="collapsed">
  <a class="brand" routerLink="/dashboard" (click)="navigate.emit()">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M5 17l4.5-5 3.5 3.5L19 8" /><path d="M14.5 8H19v4.5" /></svg>
    </span>
    @if (!collapsed) {
      <span class="brand-text">
        <strong>PFE Tracker</strong>
        <small>Suivi des candidatures</small>
      </span>
    }
  </a>

  @if (!collapsed) {
    <span class="section-label">Menu</span>
  }

  <nav>
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="link.exact ? exactMatch : subsetMatch"
        [attr.title]="collapsed ? link.label : null"
        (click)="navigate.emit()"
      >
        <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
          @switch (link.icon) {
            @case ('home') {
              <rect x="3" y="3" width="6" height="7" rx="1.5" />
              <rect x="11" y="3" width="6" height="4" rx="1.5" />
              <rect x="3" y="12" width="6" height="5" rx="1.5" />
              <rect x="11" y="9" width="6" height="8" rx="1.5" />
            }
            @case ('list') {
              <rect x="3" y="3.5" width="14" height="13" rx="2" />
              <path d="M6.5 8h7M6.5 11h7M6.5 14h4" />
            }
            @case ('plus') {
              <circle cx="10" cy="10" r="7" />
              <path d="M10 7v6M7 10h6" />
            }
            @case ('settings') {
              <circle cx="10" cy="10" r="2.6" />
              <path d="M10 2.8v2M10 15.2v2M2.8 10h2M15.2 10h2M4.9 4.9l1.4 1.4M13.7 13.7l1.4 1.4M4.9 15.1l1.4-1.4M13.7 6.3l1.4-1.4" />
            }
          }
        </svg>
        @if (!collapsed) {
          <span class="label">{{ link.label }}</span>
        }
      </a>

      @if (link.children && !collapsed) {
        <div class="sub">
          @for (child of link.children; track child.path) {
            <a
              class="sub-link"
              [routerLink]="child.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="navigate.emit()"
            >
              <svg class="sub-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4v8M4 8h8" /></svg>
              {{ child.label }}
            </a>
          }
        </div>
      }
    }
  </nav>

  <button
    type="button"
    class="collapse-btn"
    (click)="toggleCollapse.emit()"
    [attr.title]="collapsed ? 'Déplier le menu' : 'Réduire le menu'"
    [attr.aria-label]="collapsed ? 'Déplier le menu' : 'Réduire le menu'"
  >
    <svg viewBox="0 0 20 20" aria-hidden="true">
      @if (collapsed) {
        <path d="M8 6l4 4-4 4" />
      } @else {
        <path d="M12 6l-4 4 4 4" />
      }
    </svg>
    @if (!collapsed) {
      <span>Réduire le menu</span>
    }
  </button>
</aside>
