<header class="topbar">
  <button type="button" class="icon-btn menu" (click)="menuToggle.emit()" aria-label="Menu">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 6h13M3.5 10h13M3.5 14h13" /></svg>
  </button>

  <span class="today">{{ today }}</span>

  <div class="spacer"></div>

  <div class="palette">
    <button
      type="button"
      class="icon-btn"
      (click)="paletteOpen.set(!paletteOpen())"
      [class.open]="paletteOpen()"
      title="Couleur principale"
      aria-label="Choisir la couleur principale"
    >
      <span class="current" [style.background]="currentSwatch()"></span>
    </button>
    @if (paletteOpen()) {
      <div class="palette-backdrop" (click)="paletteOpen.set(false)"></div>
      <div class="palette-menu" role="menu">
        <span class="palette-title">Couleur principale</span>
        @for (a of accents; track a.id) {
          <button
            type="button"
            role="menuitemradio"
            class="swatch-row"
            [class.selected]="theme.accent() === a.id"
            [attr.aria-checked]="theme.accent() === a.id"
            (click)="theme.setAccent(a.id)"
          >
            <span class="swatch" [style.background]="a.swatch"></span>
            <span class="swatch-label">{{ a.label }}</span>
            @if (theme.accent() === a.id) {
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10.5l3 3 7-7" /></svg>
            }
          </button>
        }
      </div>
    }
  </div>

  <button
    type="button"
    class="icon-btn"
    (click)="theme.toggle()"
    [attr.aria-label]="theme.theme() === 'light' ? 'Passer en mode sombre' : 'Passer en mode clair'"
    [attr.title]="theme.theme() === 'light' ? 'Mode sombre' : 'Mode clair'"
  >
    @if (theme.theme() === 'light') {
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.2A6.5 6.5 0 0 1 7.8 4a6.5 6.5 0 1 0 8.2 8.2z" /></svg>
    } @else {
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="10" cy="10" r="3.2" />
        <path d="M10 2.5v1.8M10 15.7v1.8M2.5 10h1.8M15.7 10h1.8M4.7 4.7l1.3 1.3M14 14l1.3 1.3M4.7 15.3L6 14M14 6l1.3-1.3" />
      </svg>
    }
  </button>

  <div class="divider"></div>

  <div class="user">
    <span class="avatar">{{ initials() }}</span>
    <span class="who">
      <strong>{{ displayName() }}</strong>
      <small>{{ auth.email() }}</small>
    </span>
  </div>

  <button type="button" class="icon-btn" (click)="auth.logout()" title="Déconnexion" aria-label="Déconnexion">
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <path d="M8 4H5.5A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8" />
      <path d="M12 6.5L15.5 10 12 13.5M15.5 10H8" />
    </svg>
  </button>
</header>
